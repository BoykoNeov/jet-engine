[package]
name = "sandbox-wasm"
version = "0.1.0"
edition = "2021"

# The web sandbox's browser shell (docs/plans/sandbox-plan.md § 2) -- ONLY the exports. Every
# piece of logic is `turbojet::sandbox`, tested natively by the normal gate. A member of the
# workspace rooted at rust/Cargo.toml (roadmap A10: so the page builds the same from any folder),
# which is NOT a default member: `cargo test` of the model never builds it. It builds with the
# root's [profile.release] and into the root's target\. Its one dependency is the model itself,
# by path: the no-dependency rule (rust/Cargo.toml) is about OTHER people's code.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
turbojet = { path = ".." }
